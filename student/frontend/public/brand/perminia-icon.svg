<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A5D7A"/>
      <stop offset="100%" stop-color="#29ABE2"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="360" height="360" rx="86" ry="86" fill="url(#bgGrad)"/>

  <!-- ship's helm: 8 spokes with rounded handle tips -->
  <g fill="#FFFFFF">
    <g id="spoke">
      <rect x="188" y="66" width="24" height="130" rx="12"/>
      <circle cx="200" cy="68" r="15"/>
    </g>
    <use href="#spoke" transform="rotate(45 200 200)"/>
    <use href="#spoke" transform="rotate(90 200 200)"/>
    <use href="#spoke" transform="rotate(135 200 200)"/>
    <use href="#spoke" transform="rotate(180 200 200)"/>
    <use href="#spoke" transform="rotate(225 200 200)"/>
    <use href="#spoke" transform="rotate(270 200 200)"/>
    <use href="#spoke" transform="rotate(315 200 200)"/>
  </g>

  <!-- rim -->
  <circle cx="200" cy="200" r="95" fill="none" stroke="#FFFFFF" stroke-width="15"/>

  <!-- robot hub steering the wheel -->
  <rect x="172" y="172" width="56" height="56" rx="16" fill="#F5A623"/>
  <rect x="196" y="150" width="8" height="18" rx="4" fill="#F5A623"/>
  <circle cx="200" cy="148" r="7" fill="#F5A623"/>
  <circle cx="186" cy="197" r="7" fill="#FFFFFF"/>
  <circle cx="214" cy="197" r="7" fill="#FFFFFF"/>
</svg>
